<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noted.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <aside class="sidebar">
    <div class="logo">Noted.</div>
    <button class="btn-new" id="btnNew">+ New Note</button>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search notes…" />
    </div>
    <nav id="notesList" class="notes-list"></nav>
  </aside>

  <main class="editor-area">
    <div class="empty-state" id="emptyState">
      <span>Select a note or create one</span>
    </div>

    <div class="editor" id="editor" style="display:none">
      <div class="editor-toolbar">
        <div class="color-pickers">
          <span class="label">Color</span>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="toolbar-actions">
          <button id="btnPin" title="Pin note">📌</button>
          <button id="btnDelete" title="Delete note">🗑</button>
        </div>
      </div>

      <input type="text" id="noteTitle" class="title-input" placeholder="Title…" />
      <textarea id="noteContent" class="content-input" placeholder="Write your note…"></textarea>

      <div class="save-row">
        <span id="saveStatus" class="save-status"></span>
        <button class="btn-save" id="btnSave">Save</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
